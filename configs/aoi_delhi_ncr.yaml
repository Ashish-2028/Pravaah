# PRAVAAH — Area of Interest definition
#
# THIS FILE IS PROOF P-4 (portability).
# A new region = a copy of this file with new values. No code changes.
# Every script reads region facts from here. NEVER hardcode a coordinate,
# a threshold, or a date in Python. (Charter rule R7.)

id: delhi_ncr
name: Delhi NCR
description: >
  National Capital Region pilot. Rainfall layer is grid-based and portable;
  inundation layer needs the per-city terrain + labels defined below.

# ---------------------------------------------------------------- geometry
bbox:                       # WGS84 degrees
  west:  76.85
  east:  77.65
  south: 28.30
  north: 28.95

crs:
  geographic: EPSG:4326     # storage / interchange
  projected:  EPSG:32643    # UTM 43N — metric ops (distance, area, 100 m grid)

# --------------------------------------------------------------- rain grid
# 0.1 deg lattice -> 8 lon x 7 lat = 56 points
rain_lattice:
  resolution_deg: 0.1
  lat_start: 28.35
  lat_count: 7
  lon_start: 76.90
  lon_count: 8
  expected_points: 56

# --------------------------------------------------- inundation grid (100 m)
inundation_grid:
  resolution_m: 100
  # derived in cube/grid.py from bbox + projected CRS; asserted, never assumed

# ------------------------------------------------------------------- time
time:
  tz_internal: UTC          # charter R8 — UTC everywhere internally
  tz_display: Asia/Kolkata  # presentation layer only
  monsoon_months: [6, 7, 8, 9]

# ------------------------------------------------------------------ splits
# Charter R5 — by event and year, NEVER random
splits:
  train:
    obs:  ["2018-01-01", "2023-12-31"]
    nwp:  ["2021-01-01", "2023-12-31"]   # A2 history starts 2021
  val:    ["2024-01-01", "2024-12-31"]   # isotonic calibration fitted HERE ONLY
  test:   ["2025-01-01", "2025-12-31"]
  inundanet_spatial_block_km: 5

# ------------------------------------------------------------- thresholds
thresholds:
  # RainCast — nowcast exceedance (mm)
  nowcast:
    h1_mm: 15.0             # guaranteed head — enough positives
    h3_mm: 50.0             # thin positives; ship only if supported
  # RainFuse — OFFICIAL IMD 24 h categories (mm). Do not invent alternatives.
  forecast_24h_mm:
    heavy:            64.5
    very_heavy:      115.6
    extremely_heavy: 204.5
  leads_h: [1, 2, 3, 6]
  forecast_leads_h: [24]    # extend to [6,12,24,48,72] if time allows

# --------------------------------------------------- fitted, not hardcoded
# Charter R7: these are SEARCH SPACES. The chosen value is written back by the
# script that fitted it, together with the score table it was chosen from.
fitted:
  stream_threshold_search: [100, 250, 500, 1000, 2500]
  # FITTED by features/static_hydro.py on 2026-08-31: F1 of (flow_acc > threshold) against
  # OSM waterways, buffered match tolerance 150 m. Units: 25 m accumulation cells.
  stream_threshold_chosen: 2500
  stream_threshold_score_table: [{"threshold_cells": 100, "min_drainage_area_km2": 0.0625, "stream_cells": 573329, "precision": 0.1292, "recall": 0.7841, "f1": 0.2218}, {"threshold_cells": 250, "min_drainage_area_km2": 0.1562, "stream_cells": 378551, "precision": 0.1454, "recall": 0.6492, "f1": 0.2375}, {"threshold_cells": 500, "min_drainage_area_km2": 0.3125, "stream_cells": 276966, "precision": 0.1629, "recall": 0.5664, "f1": 0.253}, {"threshold_cells": 1000, "min_drainage_area_km2": 0.625, "stream_cells": 201008, "precision": 0.1869, "recall": 0.4971, "f1": 0.2717}, {"threshold_cells": 2500, "min_drainage_area_km2": 1.5625, "stream_cells": 131011, "precision": 0.2306, "recall": 0.4218, "f1": 0.2982}]
  operating_point_chosen: null       # <- written by models/calibrate.py

# ------------------------------------------------- static hydrology (Phase 2)
# Every knob features/static_hydro.py turns lives here, never in Python (R7).
static_hydro:
  # Terrain analysis runs at 25 m, an EXACT 4x refinement of the 100 m
  # inundation grid. 100 m layers are then a pure 4x4 block aggregate of the
  # 25 m layers — no interpolation, so no possible sub-pixel misalignment.
  hydro_resolution_m: 25

  # Copernicus GLO-30 is a DSM (Digital SURFACE Model): it includes buildings,
  # trees, flyovers and rail embankments. Those are not terrain, and in dense
  # Delhi they are 5-20 m of noise on a city whose real relief is ~30 m. Left
  # alone they wreck the pipeline in a specific, measurable way: a grey-scale
  # morphological OPENING with a structuring element wider than a building
  # footprint removes narrow positive features (roofs, embankments) while
  # leaving depressions — underpasses, the very blackspots we care about —
  # completely untouched. 175 m is wider than a Delhi city block and much
  # narrower than any real landform here.
  bare_earth_opening_m: 175

  # Buffer used to score DEM-derived streams against OSM waterways (P2-T3).
  # OSM centrelines and a 30 m DEM's channel will never coincide cell-for-cell;
  # a match tolerance is what makes the F1 meaningful rather than ~0 for every
  # candidate. 150 m = 6 hydro cells = 5 x the DEM's own posting.
  stream_match_tolerance_m: 150

  # OSM waterway values treated as "the drainage network" for scoring and for
  # the distance-to-drain / drainage-density rasters.
  drain_waterway_values: [drain, canal, river, stream, ditch]

  # Moving-window side length for drainage density (km of channel per km^2).
  drainage_density_window_m: 1000

  # ESA WorldCover v200 legend value treated as sealed surface. Asserted
  # against the downloaded tile's own `legend` metadata tag before use —
  # if ESA renumbers a class the pipeline stops rather than silently
  # computing the fraction of something else.
  worldcover_built_up_class: 50

  # Static susceptibility weights (P2-T10). DETERMINISTIC and documented —
  # this is not a learned model and we say so (charter R9). Terms are each
  # percentile-normalised to [0,1] and oriented so that 1 = more flood-prone.
  # They sum to 1 by construction; static_hydro.py asserts it.
  #   hand       1 - norm(HAND)           water pools where the ground sits low
  #                                       above its own drainage
  #   twi        norm(TWI)                big upslope area feeding a flat cell
  #   slope      1 - norm(slope)          flat ground does not shed water
  #   dist_drain norm(distance-to-drain)  far from any drain = nowhere to go
  #   impervious norm(sealed fraction)    sealed ground makes runoff instead of
  #                                       infiltration  [P2-T8, WorldCover]
  #
  # WHY THESE FIVE NUMBERS. Chosen on physical reasoning BEFORE the gate was
  # run, and deliberately not adjusted afterwards — a weight vector fitted to
  # four checkpoint scores is a fitted model pretending to be a documented
  # formula, and it would not survive one question from a judge.
  #
  #   hand 0.30       Still the largest single term. HAND is the vertical
  #                   distance to the nearest drainage; water cannot stand
  #                   anywhere with a large one. Reduced from 0.40 to make
  #                   room for impervious, not because it got weaker.
  #   impervious 0.25 Second largest. Standard urban-hydrology runoff
  #                   coefficients go from ~0.10-0.20 on cropland to
  #                   ~0.80-0.95 on sealed surface: the same 60 mm hour
  #                   delivers roughly 4-8x the runoff volume, and delivers
  #                   it in minutes rather than hours. It is ranked BELOW
  #                   hand because sealing a hillslope does not flood it —
  #                   sealing only decides how much water reaches the low
  #                   point, and hand decides whether there is one.
  #   twi 0.20        The natural-regime "how much water arrives" term
  #                   (upslope contributing area over local slope). Partly
  #                   collinear with hand, hence below it.
  #   slope 0.15      Flatness governs whether water lingers once it arrives.
  #                   Strongly collinear with both hand and twi — weighting
  #                   it higher would triple-count the same geometry.
  #   dist_drain 0.10 Smallest, because it is the least trustworthy input,
  #                   not the least relevant one. It is built from OSM
  #                   waterways, whose best F1 against DEM-derived channels
  #                   was only 0.298 (see fitted.stream_threshold_score_table
  #                   above) — Delhi's storm sewers are largely unmapped in
  #                   OSM. A layer that uncertain should not carry weight.
  susceptibility_weights:
    hand:       0.30
    twi:        0.20
    slope:      0.15
    dist_drain: 0.10
    impervious: 0.25

  # The PREVIOUS, terrain-only weight vector, kept so the gate can report the
  # before/after side by side instead of asking anyone to take it on trust.
  # Never used to produce data/static/susceptibility.tif — only recomputed
  # in memory by the gate for the comparison block.
  susceptibility_weights_terrain_only_baseline:
    hand:       0.40
    twi:        0.25
    slope:      0.20
    dist_drain: 0.15

  # Ward-level reporting (P2-T10 gate). Wards are the unit the product
  # actually delivers — a cell-level percentile is a diagnostic, a ward-level
  # percentile is the number a DDMA officer sees. Reported in
  # reports/phase2_gate.json under `ward_level`.
  ward_report_names: ["MINTO ROAD", "DARYAGANJ", "KAROL BAGH",
                      "PAHAR GANJ", "JAMA MASJID", "TURKMAN GATE"]
  ward_report_top_n: 12

  # Exit-gate landmarks. Known Delhi waterlogging blackspots, held out of every
  # computation above — they are the CHECK, never an input (PRAVAAH.md 7.3).
  # A terrain-only susceptibility map must already rank them in the top quintile.
  hotspot_checkpoints:
    - {name: "Minto Bridge",   lat: 28.6328, lon: 77.2197}
    - {name: "ITO",            lat: 28.6280, lon: 77.2410}
    - {name: "Zakhira",        lat: 28.6683, lon: 77.1553}
    - {name: "Pul Prahladpur", lat: 28.4922, lon: 77.2870}
  hotspot_pass_percentile: 80.0
  hotspot_sample_radius_m: 300   # landmark coords are approximate; report both

# --------------------------------------------------------------- risk bands
risk_bands:                 # applied to risk_score
  low:      [0.00, 0.25]
  watch:    [0.25, 0.50]
  high:     [0.50, 0.75]
  critical: [0.75, 1.01]

# ------------------------------------------------------------------- labels
labels:
  positive_buffer_m: 200    # fallback 300 if positives too thin
  negative_min_distance_m: 1000
  # Locations that MUST appear in the top quintile without being a feature.
  # Verified present in the DataMeet ward file (290 wards).
  hotspot_wards: ["MINTO ROAD", "DARYAGANJ", "KAROL BAGH", "OKHLA", "PAHAR GANJ"]
  # ITO and Zakhira are landmarks, not ward names — they fall inside
  # DARYAGANJ and KAROL BAGH respectively.

# ------------------------------------------------------------------ events
# Curated. NEVER a free date picker — every click must demo well.
#
# HOW THESE FOUR WERE CHOSEN (and why the ids are not the headline dates).
#
#   1. The IMD-gridded extreme-day catalogue (data/raw/imd_nw_daily.parquet)
#      ranked the wettest NCR rain-days independently of anything here:
#        2024-06-28  150.7 mm | 2018-07-27  129.4 mm | 2021-08-21  114.7 mm
#        2021-09-02  112.9 mm | 2023-07-09  109.2 mm
#   2. An IMD rain-day is 08:30 IST to 08:30 IST — i.e. 03:00Z to 03:00Z. So the
#      calendar date on the catalogue is NOT always the UTC day that holds the
#      storm. For every candidate we measured the hourly box-max profile in the
#      cube on D-1, D and D+1 and kept the UTC day containing the most of it.
#      That is the `id`; `imd_rain_day` records what the catalogue called it.
#   3. `demo_timestamps` is a full UTC day at hourly resolution: 0000..2300.
#      The backend sorts timestamps LEXICALLY, so an event must never cross
#      midnight — one UTC day, 24 frames, no exceptions.
#
# The hard-won lesson this encodes: the first build shipped 0400-0930Z, which is
# 09:30-15:00 IST — AFTER the storm — and produced a flat replay. Windows come
# from the rain profile, never from the calendar.
#
# Shipped events must be one UTC day and carry demo_timestamps; scripts/
# precompute.py renders exactly those.
events:
  - id: "2024-06-28"
    name: "Delhi cloudburst 28 Jun 2024"
    primary: true
    imd_rain_day: "2024-06-28"
    imd_rain_mm: 150.7
    window: ["2024-06-28T00:00Z", "2024-06-28T23:00Z"]
    # Box-max hourly: 0.6 mm at 00:00Z -> 32.9 mm at 01:00Z (06:30 IST, the
    # cloudburst peak) -> 26.2 -> 11.9 -> 9.6 -> 4.7 -> 3.2 by 06:00Z, dry from
    # 16:00Z. The whole storm sits inside this UTC day.
    peak_hour_utc: "0100"
    demo_timestamps: ["0000","0100","0200","0300","0400","0500","0600","0700",
                      "0800","0900","1000","1100","1200","1300","1400","1500",
                      "1600","1700","1800","1900","2000","2100","2200","2300"]
    notes: "228 mm at Safdarjung; IGI airport terminal canopy collapsed."
  - id: "2023-07-08"
    name: "Yamuna flood rain 8 Jul 2023"
    primary: false
    imd_rain_day: "2023-07-09"
    imd_rain_mm: 109.2
    window: ["2023-07-08T00:00Z", "2023-07-08T23:00Z"]
    # The rain that filled the Yamuna. The catalogue calls it the 9 Jul rain-day
    # (08-Jul 03:00Z -> 09-Jul 03:00Z), so the storm lives on UTC 08 Jul: rain in
    # all 24 hours, peaking 15.7 mm/h at 06:00Z with a second burst at 18:00Z.
    peak_hour_utc: "0600"
    demo_timestamps: ["0000","0100","0200","0300","0400","0500","0600","0700",
                      "0800","0900","1000","1100","1200","1300","1400","1500",
                      "1600","1700","1800","1900","2000","2100","2200","2300"]
    notes: "Yamuna went on to peak at 208.66 m on 13 Jul; ITO and Rajghat inundated."
  - id: "2021-08-21"
    name: "Delhi heavy rain 21 Aug 2021"
    primary: false
    imd_rain_day: "2021-08-21"
    imd_rain_mm: 114.7
    window: ["2021-08-21T00:00Z", "2021-08-21T23:00Z"]
    # A long-duration soaking rather than a cloudburst: 19 wet hours, box-max
    # peaking 7.6 mm/h at 01:00Z and holding 6.9 mm/h through 13:00Z. Useful
    # contrast to the 28 Jun 2024 burst.
    peak_hour_utc: "0100"
    demo_timestamps: ["0000","0100","0200","0300","0400","0500","0600","0700",
                      "0800","0900","1000","1100","1200","1300","1400","1500",
                      "1600","1700","1800","1900","2000","2100","2200","2300"]
    notes: "Widespread waterlogging; low intensity, long duration."
  - id: "2018-07-26"
    name: "Delhi heavy rain 26 Jul 2018"
    primary: false
    imd_rain_day: "2018-07-27"
    imd_rain_mm: 129.4
    window: ["2018-07-26T00:00Z", "2018-07-26T23:00Z"]
    # Catalogue date is the 27 Jul rain-day (26-Jul 03:00Z -> 27-Jul 03:00Z);
    # 21 of those 24 hours fall on UTC 26 Jul, which peaks at 26.3 mm/h at
    # 10:00Z. Predates the A2 NWP history (GFS 2021-03, ICON 2022-11, ECMWF
    # 2024-02) and the RainFuse table (2021-06 onward), so:
    #   - InundaNet is unaffected — its 17 features are static terrain plus
    #     observation-derived rain aggregates, no NWP column among them;
    #   - the 24 h forecast block falls back to the observation ratio and SAYS
    #     SO in rain_grid_*.json provenance.forecast_source.
    peak_hour_utc: "1000"
    demo_timestamps: ["0000","0100","0200","0300","0400","0500","0600","0700",
                      "0800","0900","1000","1100","1200","1300","1400","1500",
                      "1600","1700","1800","1900","2000","2100","2200","2300"]
    notes: "Pre-NWP era; forecast block is observation-derived and labelled as such."

# Candidates from the same catalogue that were MEASURED AND REJECTED. Kept here
# because "we looked and it was too thin" is a better answer than silence.
events_rejected:
  - id: "2021-09-02"
    imd_rain_mm: 112.9
    reason: >
      Thinnest of the five in the cube by a wide margin. The catalogue's 2 Sep
      rain-day maps onto UTC 1 Sep, whose box-max 24 h total is 15.2 mm against
      81.5 mm for 28 Jun 2024, and the hourly peak is 5.9 mm/h. The replay does
      move (city p_flood 0.50 -> 0.79 -> 0.53) but on rainfall a fifth the size
      of the other events, so the map would be defending a number the rain does
      not support. 2021 is represented by 21 Aug instead.

# ------------------------------------------------------------------ sources
sources:
  ward_polygons:
    url: "https://raw.githubusercontent.com/datameet/Municipal_Spatial_Data/master/Delhi/Delhi_Wards.geojson"
    id_field: Ward_No
    name_field: Ward_Name
    verified: "2026-08-31 — 290 features, Polygon, bbox lon 76.84..77.35 lat 28.40..28.88"
  dem_tiles:                # Copernicus GLO-30, s3://copernicus-dem-30m (UNSIGNED)
    - Copernicus_DSM_COG_10_N28_00_E076_00_DEM
    - Copernicus_DSM_COG_10_N28_00_E077_00_DEM
  landcover:                # P2-T8 — no Google Earth Engine anywhere
    worldcover:
      bucket: "esa-worldcover"        # AWS Open Data, UNSIGNED
      prefix: "v200/2021/map/"        # keys listed, never assumed (R6)
      tiling_deg: 3
      built_up_class: 50
      verified: "2026-08-31 — AOI needs 1 tile N27E075 (75-78E, 27-30N); COG, 36000x36000 @ 8.333e-05 deg; legend tag confirms 50 = Built-up"
    ghsl:
      url_base: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_BUILT_S_GLOBE_R2023A/GHS_BUILT_S_E2020_GLOBE_R2023A_54009_100/V1-0/tiles/"
      product: "GHS_BUILT_S_E2020_GLOBE_R2023A_54009_100_V1_0"
      units: "m2 built-up surface per 100x100 m cell (0..10000)"
      verified: "2026-08-31 — AOI falls entirely in Mollweide tile R6_C26, 29.0 MB zip, bounds x 6959000..7959000 y 3000000..4000000"
  noaa_isd_stations:
    safdarjung: "421820"
    palam:      "421810"
  nwp_models: [ecmwf_ifs025, gfs_seamless, icon_seamless]
  imd_cap_rss: "https://cap-sources.s3.amazonaws.com/in-imd-en/rss.xml"
  radar_sites: [delhi, chennai]
